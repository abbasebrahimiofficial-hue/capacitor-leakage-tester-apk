name: Build Capacitor Leakage Tester APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 35 components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Android project and launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'PYEOF'
          import base64, io, os, textwrap
          from PIL import Image, ImageDraw

          os.makedirs("app/src/main/assets", exist_ok=True)
          os.makedirs("app/src/main/java/com/capacitor/leakagetester", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)

          with open("icon.b64", "r", encoding="utf-8") as f:
              icon_b64 = "".join(f.read().split())

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read().replace("__ICON_B64__", icon_b64)
          with open("app/src/main/assets/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          img = Image.open(io.BytesIO(base64.b64decode(icon_b64))).convert("RGBA")
          densities = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }
          for folder, (size, fg_size) in densities.items():
              d = f"app/src/main/res/{folder}"
              os.makedirs(d, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(f"{d}/ic_launcher.png", "PNG")

              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size - 1, size - 1), fill=255)
              rnd = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              rnd.paste(resized, (0, 0), mask)
              rnd.save(f"{d}/ic_launcher_round.png", "PNG")

              fg = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
              inner = int(fg_size * 0.68)
              pad = (fg_size - inner) // 2
              fg.paste(img.resize((inner, inner), Image.Resampling.LANCZOS), (pad, pad))
              fg.save(f"{d}/ic_launcher_foreground.png", "PNG")

          with open("app/src/main/res/values/colors.xml", "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#0B1220</color>\n</resources>\n')

          with open("app/src/main/res/values/strings.xml", "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <string name="app_name">تست نشتی خازن</string>\n</resources>\n')

          adaptive_xml = textwrap.dedent('''\
              <?xml version="1.0" encoding="utf-8"?>
              <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
                  <background android:drawable="@color/ic_launcher_background" />
                  <foreground android:drawable="@mipmap/ic_launcher_foreground" />
              </adaptive-icon>
          ''')
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(f"app/src/main/res/mipmap-anydpi-v26/{name}", "w", encoding="utf-8") as f:
                  f.write(adaptive_xml)

          with open("settings.gradle.kts", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent('''\
                  pluginManagement {
                      repositories {
                          google()
                          maven("https://maven-central.storage-download.googleapis.com/maven2")
                          mavenCentral()
                          gradlePluginPortal()
                      }
                  }
                  dependencyResolutionManagement {
                      repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                      repositories {
                          google()
                          maven("https://maven-central.storage-download.googleapis.com/maven2")
                          mavenCentral()
                      }
                  }
                  rootProject.name = "CapacitorLeakageTester"
                  include(":app")
              '''))

          with open("build.gradle.kts", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent('''\
                  plugins {
                      id("com.android.application") version "8.7.3" apply false
                      id("org.jetbrains.kotlin.android") version "2.0.21" apply false
                  }
              '''))

          with open("gradle.properties", "w", encoding="utf-8") as f:
              f.write("org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n")

          with open("app/build.gradle.kts", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent('''\
                  plugins {
                      id("com.android.application")
                      id("org.jetbrains.kotlin.android")
                  }
                  android {
                      namespace = "com.capacitor.leakagetester"
                      compileSdk = 35
                      defaultConfig {
                          applicationId = "com.capacitor.leakagetester"
                          minSdk = 24
                          targetSdk = 35
                          versionCode = 1
                          versionName = "1.0.0"
                      }
                      buildTypes {
                          release { isMinifyEnabled = false }
                      }
                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                      kotlinOptions { jvmTarget = "17" }
                  }
                  dependencies {
                      implementation("androidx.core:core-ktx:1.15.0")
                      implementation("androidx.appcompat:appcompat:1.7.0")
                  }
              '''))

          with open("app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent('''\
                  <?xml version="1.0" encoding="utf-8"?>
                  <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                      <application
                          android:allowBackup="true"
                          android:hardwareAccelerated="true"
                          android:icon="@mipmap/ic_launcher"
                          android:roundIcon="@mipmap/ic_launcher_round"
                          android:label="@string/app_name"
                          android:supportsRtl="true"
                          android:theme="@style/Theme.AppCompat.NoActionBar">
                          <activity
                              android:name=".MainActivity"
                              android:exported="true"
                              android:configChanges="orientation|screenSize|keyboardHidden">
                              <intent-filter>
                                  <action android:name="android.intent.action.MAIN" />
                                  <category android:name="android.intent.category.LAUNCHER" />
                              </intent-filter>
                          </activity>
                      </application>
                  </manifest>
              '''))

          with open("app/src/main/java/com/capacitor/leakagetester/MainActivity.kt", "w", encoding="utf-8") as f:
              f.write(textwrap.dedent('''\
                  package com.capacitor.leakagetester

                  import android.annotation.SuppressLint
                  import android.graphics.Color
                  import android.os.Bundle
                  import android.webkit.WebSettings
                  import android.webkit.WebView
                  import android.webkit.WebViewClient
                  import androidx.appcompat.app.AppCompatActivity

                  class MainActivity : AppCompatActivity() {
                      private lateinit var webView: WebView

                      @SuppressLint("SetJavaScriptEnabled")
                      override fun onCreate(savedInstanceState: Bundle?) {
                          super.onCreate(savedInstanceState)
                          window.statusBarColor = Color.parseColor("#0B1220")
                          window.navigationBarColor = Color.parseColor("#0B1220")

                          webView = WebView(this)
                          webView.setBackgroundColor(Color.parseColor("#0B1220"))
                          webView.webViewClient = WebViewClient()
                          with(webView.settings) {
                              javaScriptEnabled = true
                              domStorageEnabled = true
                              builtInZoomControls = false
                              displayZoomControls = false
                              useWideViewPort = true
                              loadWithOverviewMode = true
                              cacheMode = WebSettings.LOAD_DEFAULT
                          }
                          setContentView(webView)
                          webView.loadUrl("file:///android_asset/index.html")
                      }

                      @Deprecated("Deprecated in Java")
                      override fun onBackPressed() {
                          if (webView.canGoBack()) webView.goBack() else super.onBackPressed()
                      }
                  }
              '''))
          print("Android project generated successfully!")
          PYEOF

      - name: Build Android APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk CapacitorLeakageTester-v1.0.0.apk
          ls -lh CapacitorLeakageTester-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapacitorLeakageTester-APK
          path: CapacitorLeakageTester-v1.0.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes 2>/dev/null || true
          gh release create v1.0.0 CapacitorLeakageTester-v1.0.0.apk \
            --target "${{ github.ref_name }}" \
            --title "Capacitor Leakage Tester v1.0.0" \
            --notes "نسخه اندروید محاسبه‌گر جریان نشتی واقعی خازن (آفلاین) همراه با نمودار دشارژ V(t) و آیکون گرافیکی اختصاصی."
